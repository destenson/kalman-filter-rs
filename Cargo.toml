[package]
name = "kalman_filters"
version = "1.1.0-dev"
authors = [
    "Dennis E <git+kalman-filters@destenson.digital>",
    "Claude AI Assistant",
]
license = "MIT"
# TODO: update to 2024
edition = "2024"
repository = "https://github.com/destenson/kalman-filter-rs"
description = "Comprehensive Kalman filter library with multiple variants (EKF, UKF, Information Filter, Particle Filter, etc.)"
keywords = ["kalman", "filter", "estimation", "tracking", "sensor-fusion"]
categories = ["algorithms", "mathematics", "science", "simulation"]
readme = "README.md"


[features]
default = ["std", "nalgebra"]
dev = ["serde", "parallel", "tracing-subscriber", "prometheus-metrics", "nalgebra"]
std = ["rand_distr/std"]
alloc = ["rand_distr/alloc"]

# Matrix operation backends (choose one, nalgebra is default)
nalgebra = ["dep:nalgebra"]
naive-matrix = []
blas-backend = ["dep:ndarray", "dep:ndarray-linalg", "dep:blas-src"]

# Other features
opencv = ["dep:opencv"]
parallel = ["rayon"]
serde = ["dep:serde", "serde/derive"]
legacy = []
tracing-subscriber = ["dep:tracing-subscriber"]
prometheus-metrics = ["dep:prometheus-client", "dep:once_cell"]


[dependencies]
approx = "0.5"
num-traits = "0.2"
rand = "0.9.2"
rand_distr = { version = "0.5.1", default-features = false }
nalgebra = { version = "0.34.1", optional = true }
ndarray = { version = "0.16", optional = true }
ndarray-linalg = { version = "0.16", optional = true }
blas-src = { version = "0.10", optional = true }
opencv = { version = "0.97", optional = true }
rayon = { version = "1.7", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
log = "0.4.28"
tracing-subscriber = { version = "0.3", features = ["env-filter",], optional = true }
prometheus-client = { version = "0.24.0", optional = true }
once_cell = { version = "1.21.3", optional = true }


[dev-dependencies]
criterion = "0.7"
env_logger = "0.11"
quickcheck = "1"
quickcheck_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[[bench]]
name = "kalman_benchmarks"
harness = false


[[example]]
path = "examples/if_sensor_network.rs"
name = "if_sensor_network"
required-features = ["std"]
