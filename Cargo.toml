[package]
name = "kalman_filters"
version = "1.1.0-dev"
authors = [
    "Dennis E <git+kalman-filters@destenson.digital>",
    "Claude AI Assistant",
]
license = "MIT"
# TODO: update to 2024
edition = "2024"
repository = "https://github.com/destenson/kalman-filter-rs"
description = "Comprehensive Kalman filter library with multiple variants (EKF, UKF, Information Filter, Particle Filter, etc.)"
keywords = ["kalman", "filter", "estimation", "tracking", "sensor-fusion"]
categories = ["algorithms", "mathematics", "science", "simulation"]
readme = "README.md"


[features]
default = ["std", "nalgebra", "naive-matrix", "openblas-static", "opencv", "parallel", "serde"]
dev = ["serde", "parallel", "tracing-subscriber", "prometheus-metrics", "nalgebra"]
std = ["rand_distr/std"]
alloc = ["rand_distr/alloc"]

# Matrix operation backends (choose one, nalgebra is default)
nalgebra = ["dep:nalgebra"]
naive-matrix = []
blas-backend = ["dep:ndarray", "std"]
# Base ndarray-linalg without specific BLAS backend
ndarray-linalg-blas = ["blas-backend"]
ndarray-linalg = ["dep:ndarray-linalg", "std"]

# BLAS backend selection (choose one when using ndarray-linalg)
# These features enable both ndarray-linalg and a specific BLAS implementation
# NOTE: Only ONE BLAS backend should be enabled at a time to avoid linker conflicts.
# openblas-static is enabled by default for --all-features compatibility.
# TODO: remove "ndarray-linalg" as a dependency (use the feature to select static iff ndarray-linalg is enabled)
# To use system OpenBLAS instead, explicitly enable it:
#   cargo build --features "openblas-system,serde,parallel"
openblas-static = ["dep:ndarray-linalg", "ndarray-linalg?/openblas-static"]
openblas-system = ["dep:ndarray-linalg", "ndarray-linalg?/openblas-system"]
# intel-mkl-dynamic-lp64 = ["dep:ndarray-linalg", "ndarray-linalg?/intel-mkl-dynamic-lp64-iomp"]
# intel-mkl-dynamic-seq = ["dep:ndarray-linalg", "ndarray-linalg?/intel-mkl-dynamic-lp64-seq"]
# intel-mkl-static-lp64 = ["dep:ndarray-linalg", "ndarray-linalg?/intel-mkl-static-lp64-iomp"]
# intel-mkl-static-seq = ["dep:ndarray-linalg", "ndarray-linalg?/intel-mkl-static-lp64-seq"]
# netlib-system = ["dep:ndarray-linalg", "ndarray-linalg?/netlib-system"]
# netlib-static = ["dep:ndarray-linalg", "ndarray-linalg?/netlib-static"]

# Other features
opencv = ["dep:opencv"]
parallel = ["rayon"]
serde = ["dep:serde", "serde/derive"]
tracing-subscriber = ["dep:tracing-subscriber"]
prometheus-metrics = ["dep:prometheus-client", "dep:once_cell"]

[target.'cfg(target_os = "macos")'.features]
# macOS-only BLAS backend
accelerate = ["blas-src/accelerate"]


[dependencies]
approx = "0.5"
num-traits = "0.2"
rand = "0.9.2"
rand_distr = { version = "0.5.1", default-features = false }
nalgebra = { version = "0.34.1", optional = true }
ndarray = { version = "0.17.1", optional = true }
ndarray-linalg = { version = "0.18.0", optional = true, default-features = false }
opencv = { version = "0.97", optional = true }
rayon = { version = "1.7", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
log = "0.4.28"
tracing-subscriber = { version = "0.3", features = ["env-filter",], optional = true }
prometheus-client = { version = "0.24.0", optional = true }
once_cell = { version = "1.21.3", optional = true }

[dev-dependencies]
criterion = "0.7"
env_logger = "0.11"
quickcheck = "1"
quickcheck_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[[bench]]
name = "kalman_benchmarks"
harness = false


[[example]]
path = "examples/if_sensor_network.rs"
name = "if_sensor_network"
required-features = ["std"]
